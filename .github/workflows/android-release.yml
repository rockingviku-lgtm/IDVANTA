name: Manual IDVANTA GitHub Release

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag name (e.g. v1.0.0-test or v1.0.0)"
        required: true
        default: "v1.0.0-test"
        type: string
      release_name:
        description: "GitHub Release title"
        required: true
        default: "IDVANTA v1.0.0 (Testing)"
        type: string
      build_type:
        description: "APK variant to build and attach"
        required: true
        default: "debug-testing"
        type: choice
        options:
          - debug-testing
          - release-signed
      draft:
        description: "Keep as Draft Release until manually reviewed and published"
        required: true
        default: true
        type: boolean
      prerelease:
        description: "Mark as Pre-release (recommended for testing APKs)"
        required: true
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  create-release:
    name: Build & Attach APK to GitHub Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK Command-Line Tools
        uses: android-actions/setup-android@v4
        with:
          packages: ""

      - name: Install Android SDK Platforms & Build Tools
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          SDKMANAGER="$(command -v sdkmanager || echo "${SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager")"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" --install "platform-tools" "platforms;android-36" "build-tools;36.0.0"
          if "$SDKMANAGER" --list | grep -q "platforms;android-36.1"; then
            "$SDKMANAGER" --install "platforms;android-36.1"
          fi

      - name: Set up Gradle & Caching
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare Gradle wrapper permissions
        shell: bash
        run: |
          if [ ! -f ./gradlew ]; then
            echo "::error::gradlew wrapper script not found in repository root."
            exit 1
          fi
          chmod +x gradlew

      - name: Build Debug Testing APK
        if: inputs.build_type == 'debug-testing'
        shell: bash
        run: |
          if [ ! -f debug.keystore ]; then
            if [ -f debug.keystore.base64 ]; then
              base64 --decode debug.keystore.base64 > debug.keystore
            else
              keytool -genkeypair -v \
                -keystore debug.keystore \
                -storepass android \
                -alias androiddebugkey \
                -keypass android \
                -keyalg RSA \
                -keysize 2048 \
                -validity 10000 \
                -dname "CN=Android Debug,O=Android,C=US"
            fi
          fi

          ./gradlew :app:assembleDebug --no-daemon --stacktrace

          APK_SOURCE="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK_SOURCE"
          unzip -tq "$APK_SOURCE"

          mkdir -p dist
          cp "$APK_SOURCE" "dist/IDVANTA-${{ inputs.tag_name }}-debug.apk"

      - name: Build Signed Release APK
        if: inputs.build_type == 'release-signed'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          ADMOB_APP_ID: ${{ secrets.ADMOB_APP_ID }}
          ADMOB_BANNER_AD_UNIT_ID: ${{ secrets.ADMOB_BANNER_AD_UNIT_ID }}
        shell: bash
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ] || [ -z "$STORE_PASSWORD" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::Missing release signing secrets (ANDROID_KEYSTORE_BASE64, STORE_PASSWORD, KEY_PASSWORD)."
            exit 1
          fi
          if [ -z "$ADMOB_APP_ID" ] || [ -z "$ADMOB_BANNER_AD_UNIT_ID" ]; then
            echo "::error::Missing production AdMob secrets (ADMOB_APP_ID, ADMOB_BANNER_AD_UNIT_ID)."
            exit 1
          fi

          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > my-upload-key.jks
          export KEYSTORE_PATH="${{ github.workspace }}/my-upload-key.jks"

          ./gradlew :app:assembleRelease --no-daemon --stacktrace
          rm -f my-upload-key.jks

          APK_SOURCE="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK_SOURCE"
          unzip -tq "$APK_SOURCE"

          mkdir -p dist
          cp "$APK_SOURCE" "dist/IDVANTA-${{ inputs.tag_name }}-release.apk"

      - name: Publish Draft / Pre-release on GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag_name }}
          name: ${{ inputs.release_name }}
          draft: ${{ inputs.draft }}
          prerelease: ${{ inputs.prerelease }}
          files: dist/*.apk
          body: |
            ### IDVANTA Android Build (${{ inputs.build_type }})
            - **Tag:** `${{ inputs.tag_name }}`
            - **Minimum SDK:** API 24 (Android 7.0)
            - **Ad Configuration:** ${{ inputs.build_type == 'debug-testing' && 'Google Official AdMob Test IDs' || 'Production AdMob Credentials' }}

            _Generated manually via GitHub Actions workflow._

      - name: Upload Build Reports on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: idvanta-release-build-reports
          path: |
            app/build/reports/
            app/build/outputs/logs/
          retention-days: 14
          if-no-files-found: ignore
