name: Build IDVANTA Testing APK

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-testing-apk:
    name: Assemble Debug Testing APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK Command-Line Tools
        uses: android-actions/setup-android@v4
        with:
          packages: ""

      - name: Install Android SDK 36.1, 36 & Build-Tools
        shell: bash
        run: |
          set +o pipefail
          SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          SDKMANAGER="$(command -v sdkmanager || echo "${SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager")"
          echo "Using Android SDK at: $SDK_ROOT"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" --install \
            "platform-tools" \
            "build-tools;36.0.0" \
            "platforms;android-36.1" \
            "platforms;android-36"

      - name: Check Gradle Wrapper presence
        id: check_wrapper
        shell: bash
        run: |
          if [ -f ./gradlew ] && [ -f ./gradle/wrapper/gradle-wrapper.jar ]; then
            echo "has_wrapper=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_wrapper=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Gradle & Caching (Wrapper)
        if: steps.check_wrapper.outputs.has_wrapper == 'true'
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Gradle & Caching (Bootstrap 9.3.1)
        if: steps.check_wrapper.outputs.has_wrapper != 'true'
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Prepare debug keystore & Gradle wrapper permissions
        shell: bash
        run: |
          if [ ! -f debug.keystore ]; then
            if [ -f debug.keystore.base64 ]; then
              base64 --decode debug.keystore.base64 > debug.keystore
            else
              keytool -genkeypair -v \
                -keystore debug.keystore \
                -storepass android \
                -alias androiddebugkey \
                -keypass android \
                -keyalg RSA \
                -keysize 2048 \
                -validity 10000 \
                -dname "CN=Android Debug,O=Android,C=US"
            fi
          fi

          if [ ! -f ./gradlew ] || [ ! -f ./gradle/wrapper/gradle-wrapper.jar ]; then
            gradle wrapper --gradle-version 9.3.1
          fi
          chmod +x gradlew

      - name: Build Debug Testing APK (AdMob Test Configuration)
        shell: bash
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Verify and rename Debug APK
        id: verify_apk
        shell: bash
        run: |
          APK_SOURCE="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$APK_SOURCE" ]; then
            echo "::error::Compiled APK not found at $APK_SOURCE"
            exit 1
          fi
          if [ ! -s "$APK_SOURCE" ]; then
            echo "::error::Compiled APK at $APK_SOURCE is empty (0 bytes)"
            exit 1
          fi

          unzip -tq "$APK_SOURCE"

          mkdir -p dist
          APK_TARGET="dist/IDVANTA-v1.0.0-debug.apk"
          cp "$APK_SOURCE" "$APK_TARGET"

          APK_SIZE_BYTES=$(stat -c%s "$APK_TARGET")
          APK_SIZE_MB=$(awk "BEGIN {printf \"%.2f\", $APK_SIZE_BYTES/1048576}")
          echo "apk_size_bytes=$APK_SIZE_BYTES" >> "$GITHUB_OUTPUT"
          echo "apk_size_mb=$APK_SIZE_MB" >> "$GITHUB_OUTPUT"

          {
            echo "## IDVANTA Testing APK Build Summary"
            echo "- **Artifact Name:** \`IDVANTA-v1.0.0-testing-apk\`"
            echo "- **APK Filename:** \`IDVANTA-v1.0.0-debug.apk\`"
            echo "- **Build Type:** Debug / Testing (Google Official Sample AdMob Test IDs)"
            echo "- **Size:** ${APK_SIZE_MB} MB (${APK_SIZE_BYTES} bytes)"
          } >> "$GITHUB_STEP_SUMMARY"

          ls -lh "$APK_TARGET"

      - name: Upload Testing APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: IDVANTA-v1.0.0-testing-apk
          path: dist/IDVANTA-v1.0.0-debug.apk
          retention-days: 30
          if-no-files-found: error

      - name: Publish Testing Pre-release in GitHub Releases
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0-testing
          name: IDVANTA v1.0.0 (Testing APK)
          prerelease: true
          make_latest: false
          files: dist/IDVANTA-v1.0.0-debug.apk
          body: |
            ### IDVANTA Testing Build (`v1.0.0-testing`)
            - **APK File:** `IDVANTA-v1.0.0-debug.apk`
            - **Build Type:** Debug / Testing (debug keystore signed)
            - **AdMob Config:** Google Official Sample Test IDs (`IS_TEST_AD_CONFIG=true`, no production credentials)
            - **Minimum SDK:** API 24 (Android 7.0) • **Target SDK:** API 36

            Download `IDVANTA-v1.0.0-debug.apk` directly from **Assets** below to install and test on Android devices.

      - name: Upload Build Reports on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: idvanta-build-failure-reports
          path: |
            app/build/reports/
            app/build/outputs/logs/
          retention-days: 14
          if-no-files-found: ignore
